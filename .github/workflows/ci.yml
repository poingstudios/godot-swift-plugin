name: "[CI] PR Validation"

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  swift-test:
    name: "Test: Swift Packages"
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run Framework Swift Unit Tests
        run: swift test

      - name: Run Example Swift Unit Tests
        run: swift test --package-path example/apple

  build-example:
    name: "Build: Example Plugin (macOS & iOS)"
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compile and Package Example Plugin
        run: ./scripts/build_local.sh all

      - name: Verify Build Artifacts
        run: |
          if [ ! -f "example/godot_editor/addons/example_plugin/bin/libGodotExamplePlugin.dylib" ]; then
            echo "Error: libGodotExamplePlugin.dylib was not generated!" >&2
            exit 1
          fi
          if [ ! -d "example/godot_editor/addons/example_plugin/bin/GodotExamplePlugin.xcframework" ]; then
            echo "Error: GodotExamplePlugin.xcframework was not generated!" >&2
            exit 1
          fi
          echo "All example build artifacts successfully generated and verified."

  gdlint:
    name: "Lint: GDScript"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install gdlint
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit

      - name: Run gdlint
        run: gdlint example/godot_editor/addons/ example/godot_editor/sample/

  pr-validation-status:
    name: "PR Validation Status"
    needs: [swift-test, build-example, gdlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.swift-test.result }}" != "success" ] || \
             [ "${{ needs.build-example.result }}" != "success" ] || \
             [ "${{ needs.gdlint.result }}" != "success" ]; then
            echo "PR validation failed!" >&2
            exit 1
          fi
          echo "All PR validations passed successfully."
